<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YMT 新型充電器全數點檢專案管理 (247台限定)</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Leaflet Map CSS & JS (Cloudflare CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdfa', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 900: '#134e4a' }
          }
        }
      }
    }
  </script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    
    #map {
      height: 480px;
      width: 100%;
      background: #1e293b;
      border-radius: 0 0 1rem 1rem;
    }
    
    .leaflet-popup-content-wrapper {
      background: #0f172a !important;
      color: #f1f5f9 !important;
      border: 1px solid #334155 !important;
      border-radius: 0.75rem !important;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-tip { background: #0f172a !important; border: 1px solid #334155 !important; }
    .custom-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 700;
      color: white;
      font-size: 11px;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.6);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .custom-pin:hover { transform: scale(1.25); z-index: 1000 !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-teal-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-teal-500/20 border border-teal-500/30 flex items-center justify-center text-teal-400">
          <i data-lucide="zap" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg text-white">YMT 新型充電器全數點檢看板</h1>
            <span class="text-[11px] px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/30 mono font-semibold">247台限定</span>
          </div>
          <p class="text-xs text-slate-400">量產前樣機 (AF0JYT-20AP1系列) 營業所巡檢追蹤與管理系統</p>
        </div>
      </div>

      <!-- Quick Stats -->
      <div class="flex items-center gap-4 sm:gap-6 text-xs">
        <div class="text-right">
          <span class="text-slate-400 block text-[10px]">點檢總台數</span>
          <span class="mono font-bold text-lg text-teal-400">247 <span class="text-xs font-normal text-slate-400">台</span></span>
        </div>
        <div class="text-right border-l border-slate-800 pl-4 sm:pl-6">
          <span class="text-slate-400 block text-[10px]">巡檢營業所</span>
          <span class="mono font-bold text-lg text-white">38 <span class="text-xs font-normal text-slate-400">站</span></span>
        </div>
        <div class="text-right border-l border-slate-800 pl-4 sm:pl-6 hidden sm:block">
          <span class="text-slate-400 block text-[10px]">涵蓋區域</span>
          <span class="mono font-bold text-lg text-indigo-400">14 <span class="text-xs font-normal text-slate-400">都縣</span></span>
        </div>
        <div class="text-right border-l border-slate-800 pl-4 sm:pl-6 hidden md:block">
          <span class="text-slate-400 block text-[10px]">作業期程</span>
          <span class="mono font-semibold text-slate-300 text-sm">11/03 ~ 11/12</span>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="border-t border-slate-800/80 bg-slate-900/50 px-4 sm:px-6">
      <div class="max-w-7xl mx-auto flex items-center justify-between overflow-x-auto gap-2 py-2">
        <nav class="flex items-center gap-1 sm:gap-2">
          <a href="#overview" onclick="navigate('overview')" id="nav-overview" class="nav-tab px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition text-white bg-teal-600">
            <i data-lucide="map" class="w-3.5 h-3.5"></i> 全國總覽
          </a>
          <a href="#prefs" onclick="navigate('prefs')" id="nav-prefs" class="nav-tab px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i> 各都縣彙整
          </a>
          <a href="#list" onclick="navigate('list')" id="nav-list" class="nav-tab px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="table" class="w-3.5 h-3.5"></i> 站點清單
          </a>
          <a href="#tokyo" onclick="navigate('tokyo')" id="nav-tokyo" class="nav-tab px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-sky-400"></i> 東京都專區
          </a>
        </nav>

        <div class="flex items-center gap-2">
          <button onclick="exportCSV()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs text-slate-300 flex items-center gap-1.5 transition">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> 匯出 CSV
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6 flex-1 w-full">

    <!-- Leaflet Map Card (Focused exclusively on Japan) -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative">
      <div class="px-4 py-3 bg-slate-950 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-teal-400 animate-pulse"></span>
          <h2 class="font-bold text-sm text-white flex items-center gap-2">
            日本全國巡檢站點地理分佈圖
            <span id="mapSubtitle" class="text-xs font-normal text-slate-400">(共 38 所 / 247 台)</span>
          </h2>
        </div>

        <!-- Quick View Buttons -->
        <div class="flex items-center gap-1.5 text-xs">
          <button onclick="resetMapView()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">🇯🇵 日本全域</button>
          <button onclick="zoomToRegion('kantou')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">關東圈 (174台)</button>
          <button onclick="zoomToRegion('tokyo')" class="px-2.5 py-1 bg-sky-900/60 border border-sky-800 hover:bg-sky-800 rounded-lg text-sky-200 transition">東京都核心 (129台)</button>
          <button onclick="zoomToRegion('west')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">中西日本 / 返送</button>
        </div>
      </div>

      <!-- Map Container -->
      <div id="map"></div>

      <!-- Map Legend -->
      <div class="px-4 py-2 bg-slate-950/90 border-t border-slate-800 flex flex-wrap items-center justify-between gap-4 text-xs text-slate-400">
        <div class="flex items-center gap-4 flex-wrap">
          <span class="font-medium text-slate-300">圖例：</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-teal-500 border border-white inline-block"></span> A 組現場 (3人)</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-indigo-500 border border-white inline-block"></span> B 組現場 (3人)</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500 border border-white inline-block"></span> 東京返送希望 (集中作業)</span>
        </div>
        <div class="text-[11px] text-slate-500">
          💡 圖資採用日本國土地理院官方地圖 (GSI)，可自由放大縮小日本各營業所
        </div>
      </div>
    </div>

    <!-- TAB 1: 全國總覽 (#overview) -->
    <section id="view-overview" class="space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
          <div class="text-xs text-slate-400 mb-1 flex items-center justify-between">
            <span>A 組現場巡檢</span>
            <span class="px-2 py-0.5 rounded bg-teal-500/10 text-teal-400 border border-teal-500/20 text-[10px]">18 營業所</span>
          </div>
          <div class="mono text-2xl font-bold text-teal-400">128 <span class="text-xs font-normal text-slate-400">台 (51.8%)</span></div>
          <div class="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
            <div class="bg-teal-500 h-full rounded-full" style="width: 51.8%"></div>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
          <div class="text-xs text-slate-400 mb-1 flex items-center justify-between">
            <span>B 組
